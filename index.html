<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Home Automation Dashboard</title>
    <!-- MQTT Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #111827);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        /* Bird Animation */
        .bird-icon {
            width: 45px;
            height: 45px;
            background: #38bdf8;
            border-radius: 50%;
            position: relative;
            animation: floatBird 2s ease-in-out infinite;
        }
        .bird-icon::before {
            content: "🐦";
            font-size: 26px;
            position: absolute;
            top: 6px;
            left: 8px;
        }
        @keyframes floatBird {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .status-badge, .clock-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .online { background: #22c55e; color: white; box-shadow: 0 0 10px #22c55e; }
        .offline { background: #ef4444; color: white; box-shadow: 0 0 10px #ef4444; }
        .clock-badge { background: #1e293b; border: 1px solid #334155; color: #38bdf8; }

        .container {
            width: 100%;
            max-width: 500px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        h2 { color: #38bdf8; font-size: 18px; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        
        /* Neon Manual Control Buttons */
        .relay-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .neon-btn {
            background: #0f172a;
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 5px rgba(239, 68, 68, 0.2);
        }
        .neon-btn.active {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
            box-shadow: 0 0 15px #22c55e, inset 0 0 5px rgba(255,255,255,0.5);
        }

        /* Form elements */
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #cbd5e1; }
        input[type="time"], select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 5px;
        }
        .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #475569;
            cursor: pointer;
            font-size: 13px;
        }
        .btn {
            background: #10b981;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #059669; }

        /* Schedule List View */
        .schedule-item {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-info b { color: #38bdf8; font-size: 16px; }
        .schedule-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-left: 5px;
        }
        .add-toggle-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="bird-icon"></div>
        <h1>Bird Home Dashboard</h1>
        <div id="statusBadge" class="status-badge offline">Connecting...</div>
        <div id="liveClock" class="clock-badge">--:--:--</div>
    </div>

    <div class="container">
        <!-- Manual Control Card with Neon Animation -->
        <div class="card">
            <h2>Manual Relay Control</h2>
            <div class="relay-grid" style="margin-top: 15px;">
                <button class="neon-btn" id="rBtn1" onclick="toggleRelay(1)">Light 1: OFF</button>
                <button class="neon-btn" id="rBtn2" onclick="toggleRelay(2)">Light 2: OFF</button>
                <button class="neon-btn" id="rBtn3" onclick="toggleRelay(3)">Light 3: OFF</button>
                <button class="neon-btn" id="rBtn4" onclick="toggleRelay(4)">Light 4: OFF</button>
            </div>
        </div>

        <!-- Automation Schedules Card -->
        <div class="card">
            <h2>
                Automation Schedules 
                <button class="add-toggle-btn" onclick="toggleForm()">+ Add New</button>
            </h2>

            <!-- Hidden Form to Create Schedule -->
            <div id="scheduleForm" style="display: none; margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
                <div class="form-group">
                    <label>Execution Time</label>
                    <input type="time" id="execTime" value="06:00">
                </div>

                <div class="form-group">
                    <label>Action</label>
                    <select id="actionType">
                        <option value="ON">TURN ON</option>
                        <option value="OFF">TURN OFF</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Target Outputs</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" class="light-chk" value="1"> Light 1</label>
                        <label><input type="checkbox" class="light-chk" value="2"> Light 2</label>
                        <label><input type="checkbox" class="light-chk" value="3"> Light 3</label>
                        <label><input type="checkbox" class="light-chk" value="4"> Light 4</label>
                    </div>
                </div>

                <button class="btn" onclick="saveSchedule()">Save Automation Schedule</button>
            </div>

            <!-- List View of Schedules -->
            <div id="scheduleList" style="margin-top: 15px;">
                <!-- Dynamically populated items will go here -->
            </div>
        </div>
    </div>

    <!-- Click Audio Effect -->
    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        let client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "web_client_" + parseInt(Math.random() * 100, 10));
        let schedules = [];
        let relayStates = [false, false, false, false];

        function playSound() {
            document.getElementById("clickSound").currentTime = 0;
            document.getElementById("clickSound").play().catch(e => {});
        }

        // Live Realtime Clock
        setInterval(() => {
            let now = new Date();
            document.getElementById("liveClock").innerText = now.toLocaleTimeString();
        }, 1000);

        client.onConnectionLost = function (responseObject) {
            document.getElementById("statusBadge").innerText = "Offline";
            document.getElementById("statusBadge").className = "status-badge offline";
            setTimeout(connectMQTT, 4000);
        };

        client.onMessageArrived = function (message) {
            let topic = message.destinationName;
            let payload = message.payloadString;

            // Handle manual status feedback from ESP32
            if(topic.startsWith("arpit_home/relay")) {
                let rNum = parseInt(topic.charAt(topic.length - 1));
                let state = (payload === "1");
                relayStates[rNum - 1] = state;
                updateButtonUI(rNum, state);
            }
        };

        function connectMQTT() {
            client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: false });
        }

        function onConnect() {
            document.getElementById("statusBadge").innerText = "Online (WiFi)";
            document.getElementById("statusBadge").className = "status-badge online";
            client.subscribe("arpit_home/status");
            client.subscribe("arpit_home/relay1");
            client.subscribe("arpit_home/relay2");
            client.subscribe("arpit_home/relay3");
            client.subscribe("arpit_home/relay4");
        }

        function onFailure(message) {
            document.getElementById("statusBadge").innerText = "Offline";
            document.getElementById("statusBadge").className = "status-badge offline";
            setTimeout(connectMQTT, 4000);
        }

        connectMQTT();

        // Toggle Form Visibility
        function toggleForm() {
            playSound();
            let form = document.getElementById("scheduleForm");
            form.style.display = form.style.display === "none" ? "block" : "none";
        }

        // Manual Relay Toggle with Neon Effect
        function toggleRelay(rNum) {
            playSound();
            let currentState = relayStates[rNum - 1];
            let newState = !currentState;
            
            if (client.isConnected()) {
                let message = new Paho.MQTT.Message(newState ? "1" : "0");
                message.destinationName = "arpit_home/relay" + rNum;
                client.send(message);
            }
        }

        function updateButtonUI(rNum, state) {
            let btn = document.getElementById("rBtn" + rNum);
            if (state) {
                btn.className = "neon-btn active";
                btn.innerText = "Light " + rNum + ": ON";
            } else {
                btn.className = "neon-btn";
                btn.innerText = "Light " + rNum + ": OFF";
            }
        }

        // Save Schedule & Push to List View
        function saveSchedule() {
            playSound();
            let time = document.getElementById("execTime").value;
            let action = document.getElementById("actionType").value;
            
            let selectedLights = [];
            document.querySelectorAll(".light-chk:checked").forEach((cb) => {
                selectedLights.push("L" + cb.value);
            });

            if(selectedLights.length === 0) {
                alert("Please select at least one target output light!");
                return;
            }

            let newSched = {
                id: Date.now(),
                time: time,
                action: action,
                outputs: selectedLights
            };

            schedules.push(newSched);
            renderScheduleList();
            toggleForm();

            // Send to ESP32 via MQTT
            if (client.isConnected()) {
                let message = new Paho.MQTT.Message(JSON.stringify(newSched));
                message.destinationName = "arpit_home/add_schedule";
                client.send(message);
            }
        }

        // Delete Schedule Item
        function deleteSchedule(id) {
            playSound();
            schedules = schedules.filter(s => s.id !== id);
            renderScheduleList();
            // Optional: send delete command or update payload to ESP32
        }

        // Render Schedule List View
        function renderScheduleList() {
            let listDiv = document.getElementById("scheduleList");
            listDiv.innerHTML = "";

            if(schedules.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; color:#64748b; font-size:13px;'>No active automation tasks.</p>";
                return;
            }

            schedules.forEach(s => {
                let item = document.createElement("div");
                item.className = "schedule-item";
                item.innerHTML = `
                    <div class="schedule-info">
                        <b>${s.time}</b> [${s.action}]<br>
                        <span style="font-size:12px; color:#94a3b8;">Outputs: [${s.outputs.join(", ")}]</span>
                    </div>
                    <div class="schedule-actions">
                        <button onclick="deleteSchedule(${s.id})" title="Delete">🗑️</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        // Initialize empty list
        renderScheduleList();
    </script>
</body>
</html>
